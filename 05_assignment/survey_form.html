<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Survey Form</title>
    </head>
    <body>
        <h1>Website User Experience Survey</h1>

        <p>Please share your experience and help us improve our website.</p>

        <form>
            <h2>User Information</h2>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <h2>User Experience</h2>

            <p>How satisfied are you with our website?</p>

            <input type="radio" id="very-satisfied" name="satisfaction" value="very-satisfied" required>
            <label for="very-satisfied">Very Satisfied</label><br>

            <input type="radio" id="satisfied" name="satisfaction" value="satisfied">
            <label for="satisfied">Satisfied</label><br>

            <input type="radio" id="neutral" name="satisfaction" value="neutral">
            <label for="neutral">Neutral</label><br>

            <input type="radio" id="dissatisfied" name="satisfaction" value="dissatisfied">
            <label for="dissatisfied">Dissatisfied</label><br>

            <input type="radio" id="very-dissatisfied" name="satisfaction" value="very-dissatisfied">
            <label for="very-dissatisfied">Very Dissatisfied</label>

            <h2>Website Features</h2>

            <p>What features do you value most? (Select all that apply)</p>

            <input type="checkbox" id="design" name="features" value="design">
            <label for="design">User-friendly Design</label><br>

            <input type="checkbox" id="speed" name="features" value="speed">
            <label for="speed">Fast Loading Speed</label><br>

            <input type="checkbox" id="navigation" name="features" value="navigation">
            <label for="navigation">Easy Navigation</label><br>

            <input type="checkbox" id="content" name="features" value="content">
            <label for="content">Informative Content</label>

            <h2>User Role</h2>

            <label for="role">What best describes you?</label>

            <select id="role" name="role" required>
                <option value="">Select your role</option>
                <option value="student">Student</option>
                <option value="professional">Professional</option>
                <option value="hobbyist">Hobbyist</option>
                <option value="other">Other</option>
            </select>

            <h2>Additional Comments</h2>

            <label for="comments">Additional comments or suggestions?</label>

            <br><br>

            <textarea id="comments" name="comments" rows="5" cols="40" placeholder="Enter your feedback here..."></textarea>

            <br><br>

            <button type="submit">Submit Survey</button>
        </form>
    </body>
</html>
